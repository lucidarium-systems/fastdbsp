# dbsp 0.2.0's manifest as crates.io serves it (cargo normalized it from feldera/feldera@3846fcd0d7f6,
# crates/dbsp/Cargo.toml), renamed to fastdbsp. The library keeps the name `dbsp`, so code written
# against dbsp 0.2 builds unchanged.

[package]
edition = "2021"
name = "fastdbsp"
version = "0.2.0"
publish = true
description = "dbsp 0.2.0, the continuous streaming analytics engine, with two performance fixes for nested circuits"
homepage = "https://github.com/lucidarium-systems/fastdbsp"
readme = "README.md"
keywords = [
    "DBSP",
    "streaming",
    "analytics",
    "database",
]
categories = [
    "algorithms",
    "data-structures",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lucidarium-systems/fastdbsp"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[package.metadata.release]
release = true

[lib]
name = "dbsp"

[[example]]
name = "orgchart"

[[example]]
name = "degrees"

[[example]]
name = "tutorial1"
path = "examples/tutorial/tutorial1.rs"

[[example]]
name = "tutorial2"
path = "examples/tutorial/tutorial2.rs"

[[example]]
name = "tutorial3"
path = "examples/tutorial/tutorial3.rs"

[[example]]
name = "tutorial4"
path = "examples/tutorial/tutorial4.rs"

[[example]]
name = "tutorial5"
path = "examples/tutorial/tutorial5.rs"

[[example]]
name = "tutorial6"
path = "examples/tutorial/tutorial6.rs"

[[example]]
name = "tutorial7"
path = "examples/tutorial/tutorial7.rs"

[[example]]
name = "tutorial8"
path = "examples/tutorial/tutorial8.rs"

[[example]]
name = "tutorial9"
path = "examples/tutorial/tutorial9.rs"

[[example]]
name = "coord"
path = "examples/dist/coord.rs"

[[example]]
name = "pool"
path = "examples/dist/pool.rs"

[[bench]]
name = "galen"
harness = false
required-features = ["with-csv"]

[[bench]]
name = "fraud"
harness = false
required-features = [
    "with-csv",
    "with-serde",
]

[[bench]]
name = "path"
harness = false

[[bench]]
name = "consolidation"
harness = false

[[bench]]
name = "ldbc-graphalytics"
harness = false
required-features = ["with-csv"]

[[bench]]
name = "column_layer"
harness = false

[[bench]]
name = "gdelt"
harness = false

[dependencies.anyhow]
version = "1.0.57"

[dependencies.arc-swap]
version = "1.5.1"

[dependencies.arcstr]
version = "1.1.4"

[dependencies.crossbeam]
version = "0.8.2"

[dependencies.crossbeam-utils]
version = "0.8.6"

[dependencies.csv]
version = "1.2.2"
optional = true

[dependencies.futures]
version = "0.3"

[dependencies.hashbrown]
version = "0.13.0"

[dependencies.impl-trait-for-tuples]
version = "0.2"

[dependencies.itertools]
version = "0.10.5"

[dependencies.log]
version = "0.4.20"

[dependencies.mimalloc-rust-sys]
version = "1.7.2"

[dependencies.num]
version = "0.4.0"

[dependencies.once_cell]
version = "1.9.0"

[dependencies.ordered-float]
version = "3.9.1"
features = [
    "serde",
    "rkyv",
]

[dependencies.petgraph]
version = "0.6.0"

[dependencies.priority-queue]
version = "1.2.1"

[dependencies.rand]
version = "0.8.5"

[dependencies.rkyv]
version = "0.7.42"

[dependencies.rocksdb]
version = "0.21"
features = ["multi-threaded-cf"]
optional = true
default-features = false

[dependencies.rust_decimal]
version = "1.29"

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dependencies.size-of]
version = "0.1.5"
features = [
    "hashbrown",
    "time-std",
    "xxhash-xxh3",
    "arcstr",
    "chrono",
    "ordered-float",
]

[dependencies.tarpc]
version = "0.33.0"
features = ["full"]

[dependencies.textwrap]
version = "0.15.0"

[dependencies.time]
version = "0.3.20"
features = [
    "formatting",
    "macros",
    "serde",
    "serde-human-readable",
]

[dependencies.tokio]
version = "1.25.0"
features = [
    "macros",
    "rt",
    "rt-multi-thread",
]

[dependencies.typedmap]
version = "0.3.0"
features = ["dashmap"]

[dependencies.uuid]
version = "1.1.2"
features = ["v4"]
optional = true

[dependencies.xxhash-rust]
version = "0.8.6"
features = ["xxh3"]

[dev-dependencies.chrono]
version = "0.4.26"
features = [
    "rkyv",
    "serde",
]

[dev-dependencies.clap]
version = "3.2.8"
features = [
    "derive",
    "env",
]

[dev-dependencies.criterion]
version = "0.4.0"

[dev-dependencies.csv]
version = "1.2.2"

[dev-dependencies.indicatif]
version = "0.17.0-rc.11"

[dev-dependencies.proptest]
version = "1.0.0"

[dev-dependencies.proptest-derive]
version = "0.3.0"

[dev-dependencies.rand_chacha]
version = "0.3.1"

[dev-dependencies.rand_xoshiro]
version = "0.6.0"

[dev-dependencies.reqwest]
version = "0.11.11"
features = ["blocking"]

[dev-dependencies.serde_json]
version = "1.0.87"

[dev-dependencies.tar]
version = "0.4.38"

[dev-dependencies.zip]
version = "0.6.2"

[dev-dependencies.zstd]
version = "0.12.0"

[features]
default = ["with-serde"]
persistence = [
    "rocksdb",
    "uuid",
]
with-csv = ["csv"]
with-serde = ["serde"]
